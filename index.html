<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Circuit Debugger</title>
    <style>html{background:#0d1117}</style>
  </head>
  <body>
    <nav id="page-nav">
      <a href="./index.html" class="active">Circuit</a>
      <a href="./bloch.html">Bloch Sphere</a>
    </nav>

    <div id="circuit-app">
      <div id="circuit-main-row">

        <!-- Left column: diagram + histogram -->
        <div id="circuit-left-col">

          <!-- Circuit diagram -->
          <div id="circuit-diagram">
            <div id="circuit-scroll">
              <!-- biome-ignore lint/a11y/noSvgWithoutTitle: title injected by renderer.ts -->
              <svg id="circuit-svg"></svg>
            </div>
          </div>

          <!-- Results: controls + histogram + phase legend -->
          <div id="circuit-results" style="visibility:hidden">
            <div id="results-header">
              <button type="button" id="reset-btn">Reset</button>
              <button type="button" id="run-btn">Run <kbd>⌘↵</kbd></button>
              <button type="button" id="prev-btn" disabled>◀</button>
              <button type="button" id="next-btn">▶</button>
              <div class="results-divider"></div>
              <span id="step-label" class="step-label">Initial state</span>
              <div class="results-divider"></div>
              <div id="phase-legend-inline">
                <span class="phase-pip" style="background:hsl(180,80%,50%)">0</span>
                <span class="phase-pip" style="background:hsl(270,80%,50%)">π/2</span>
                <span class="phase-pip" style="background:hsl(0,80%,50%)">π</span>
                <span class="phase-pip" style="background:hsl(90,80%,50%)">−π/2</span>
              </div>
            </div>
            <!-- biome-ignore lint/a11y/noSvgWithoutTitle: title injected by histogram.ts -->
            <svg id="histogram-svg" style="display:block;width:100%"></svg>
          </div>

        </div>

        <!-- Right: input panel (full height) -->
        <aside id="circuit-sidebar">
          <div id="sidebar-presets">
            <button type="button" data-circuit="bell_phi_plus"  class="active">Φ⁺</button>
            <button type="button" data-circuit="bell_phi_minus" >Φ⁻</button>
            <button type="button" data-circuit="bell_psi_plus"  >Ψ⁺</button>
            <button type="button" data-circuit="bell_psi_minus" >Ψ⁻</button>
            <button type="button" data-circuit="ghz"            >GHZ</button>
            <button type="button" data-circuit="grover"         >Grover</button>
          </div>
          <div id="sidebar-input">
            <textarea id="circuit-input" spellcheck="false"
              placeholder="H 0&#10;CX 0 1"></textarea>
            <div id="parse-error" class="parse-error"></div>
          </div>
        </aside>

      </div>
    </div>
    <script type="module" src="/src/circuit/main.ts"></script>
  </body>
</html>
